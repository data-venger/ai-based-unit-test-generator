version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:11434/api/tags > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  ollama: {}
